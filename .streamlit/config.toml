primaryColor = "#39b7a5"
backgroundColor = "#0d1418"
secondaryBackgroundColor = "#162127"
textColor = "#e5eef0"
linkColor = "#6dd8ca"
borderColor = "#2a3b43"
dataframeBorderColor = "#2a3b43"
